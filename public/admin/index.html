<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royale International Admin</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17202a;background:#f5f7fa}
*{box-sizing:border-box}body{margin:0}header{background:#111;color:#fff;padding:18px 24px}main{max-width:1180px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 2px 12px #00000012}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.row{display:flex;gap:10px;flex-wrap:wrap}input,select,textarea,button{font:inherit;padding:11px;border:1px solid #d5dbe2;border-radius:7px}input,select{min-width:180px}button{cursor:pointer;background:#111;color:#fff;border-color:#111}.muted{color:#667085}.error{color:#b42318}.success{color:#027a48}.stat{border:1px solid #e4e7ec;border-radius:9px;padding:15px}.stat b{display:block;margin-bottom:6px}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}.hidden{display:none}.login{max-width:480px;margin:60px auto}.full{width:100%;margin-top:10px}.timeline{border-left:2px solid #ddd;padding-left:16px}.event{margin-bottom:18px}
</style>
</head>
<body>
<header><strong>Royale International — Admin Dashboard</strong></header>
<main>
<section id="loginCard" class="card login">
<h2 id="loginTitle">Admin Login</h2>
<p id="loginHelp" class="muted">Enter your authorized email address to continue.</p>
<div id="emailStep">
<input id="email" class="full" type="email" placeholder="Authorized email">
<button class="full" onclick="checkEmail()">Continue</button>
</div>
<div id="passwordSetupStep" class="hidden">
<input id="newPassword" class="full" type="password" placeholder="Create password (8+ characters)">
<input id="confirmPassword" class="full" type="password" placeholder="Confirm password">
<button class="full" onclick="setupPassword()">Create Password & Enter Dashboard</button>
</div>
<div id="passwordLoginStep" class="hidden">
<input id="existingPassword" class="full" type="password" placeholder="Password">
<button class="full" onclick="login()">Log In</button>
</div>
<p id="authMsg"></p>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<div class="row"><h2 style="margin-right:auto">Overview</h2><button onclick="logout()">Log out</button></div>
<div id="stats" class="grid"></div>
</div>

<div class="card">
<h2>Shipments</h2>
<div class="row">
<input id="search" placeholder="Search tracking, reference, sender, recipient, route">
<button onclick="loadShipments()">Search</button>
<button onclick="showCreate()">Create Shipment</button>
</div>
<div style="overflow:auto;margin-top:16px">
<table><thead><tr><th>Tracking</th><th>Recipient</th><th>Route</th><th>Status</th><th></th></tr></thead>
<tbody id="shipments"></tbody></table>
</div>
</div>

<div id="createCard" class="card hidden">
<h2>Create Shipment</h2>
<div class="grid">
<input id="senderName" placeholder="Sender name">
<input id="senderContact" placeholder="Sender contact">
<input id="senderEmail" placeholder="Sender email">
<input id="recipientName" placeholder="Recipient name">
<input id="recipientContact" placeholder="Recipient contact">
<input id="recipientEmail" placeholder="Recipient email">
<input id="origin" placeholder="Origin">
<input id="destination" placeholder="Destination">
<input id="currentLocation" placeholder="Current location">
<input id="reference" placeholder="Shipment reference">
<input id="delivery" type="date">
</div>
<br><button onclick="createShipment()">Create Shipment</button>
<button onclick="hideCreate()">Cancel</button>
<p id="createMsg"></p>
</div>

<div id="detailCard" class="card hidden"></div>
</section>
</main>

<script>
let token=localStorage.getItem("royale_admin_token")||"";
let currentEmail="";

const $=id=>document.getElementById(id);

async function request(path,options={}){
  const headers={...(options.headers||{}),"Content-Type":"application/json"};
  if(token) headers.Authorization="Bearer "+token;
  const response=await fetch(path,{...options,headers});
  const data=await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(data.error||"Request failed");
  return data;
}

function showAuthMessage(message,type="error"){
  $("authMsg").textContent=message;
  $("authMsg").className=type;
}

async function checkEmail(){
  try{
    const email=$("email").value.trim().toLowerCase();
    const data=await request("/api/auth/check-email",{method:"POST",body:JSON.stringify({email})});
    currentEmail=email;
    $("emailStep").classList.add("hidden");
    $("loginHelp").textContent="Authorized email confirmed.";
    if(data.requiresPasswordSetup){
      $("loginTitle").textContent="Create Your Admin Password";
      $("passwordSetupStep").classList.remove("hidden");
      $("newPassword").focus();
    }else{
      $("loginTitle").textContent="Enter Your Password";
      $("passwordLoginStep").classList.remove("hidden");
      $("existingPassword").focus();
    }
  }catch(e){showAuthMessage(e.message)}
}

async function setupPassword(){
  try{
    const password=$("newPassword").value;
    const confirmPassword=$("confirmPassword").value;
    const data=await request("/api/auth/setup-password",{method:"POST",body:JSON.stringify({email:currentEmail,password,confirmPassword})});
    token=data.token;
    localStorage.setItem("royale_admin_token",token);
    openDashboard();
  }catch(e){showAuthMessage(e.message)}
}

async function login(){
  try{
    const password=$("existingPassword").value;
    const data=await request("/api/auth/login",{method:"POST",body:JSON.stringify({email:currentEmail,password})});
    token=data.token;
    localStorage.setItem("royale_admin_token",token);
    openDashboard();
  }catch(e){showAuthMessage(e.message)}
}

function openDashboard(){
  $("loginCard").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  loadStats();
  loadShipments();
}

function logout(){
  token="";
  localStorage.removeItem("royale_admin_token");
  location.reload();
}

async function loadStats(){
  try{
    const d=await request("/api/admin/stats");
    $("stats").innerHTML='<div class="stat"><b>Total Shipments</b>'+d.total+'</div>'+
      Object.entries(d.byStatus).map(([k,v])=>'<div class="stat"><b>'+k.replaceAll("_"," ")+'</b>'+v+'</div>').join("");
  }catch(e){}
}

async function loadShipments(){
  try{
    const q=encodeURIComponent($("search").value||"");
    const d=await request("/api/admin/shipments?q="+q);
    $("shipments").innerHTML=d.items.map(s=>'<tr>'+
      '<td>'+s.trackingNumber+'</td>'+
      '<td>'+s.recipientName+'</td>'+
      '<td>'+s.origin+' → '+s.destination+'</td>'+
      '<td>'+s.status.replaceAll("_"," ")+'</td>'+
      '<td><button onclick="viewShipment(\''+s.id+'\')">View</button></td>'+
      '</tr>').join("") || '<tr><td colspan="5">No shipments found.</td></tr>';
  }catch(e){}
}

function showCreate(){$("createCard").classList.remove("hidden")}
function hideCreate(){$("createCard").classList.add("hidden")}

async function createShipment(){
  try{
    const body={
      senderName:$("senderName").value,
      senderContact:$("senderContact").value,
      senderEmail:$("senderEmail").value,
      recipientName:$("recipientName").value,
      recipientContact:$("recipientContact").value,
      recipientEmail:$("recipientEmail").value,
      origin:$("origin").value,
      destination:$("destination").value,
      currentLocation:$("currentLocation").value,
      shipmentReference:$("reference").value,
      estimatedDeliveryDate:$("delivery").value?new Date($("delivery").value).toISOString():""
    };
    const data=await request("/api/admin/shipments",{method:"POST",body:JSON.stringify(body)});
    $("createMsg").textContent="Created shipment "+data.trackingNumber;
    $("createMsg").className="success";
    loadStats();loadShipments();
  }catch(e){$("createMsg").textContent=e.message;$("createMsg").className="error"}
}

async function viewShipment(id){
  try{
    const s=await request("/api/admin/shipments/"+id);
    $("detailCard").classList.remove("hidden");
    $("detailCard").innerHTML='<h2>'+s.trackingNumber+'</h2>'+
      '<p><b>Status:</b> '+s.status.replaceAll("_"," ")+'</p>'+
      '<p><b>Route:</b> '+s.origin+' → '+s.destination+'</p>'+
      '<p><b>Current location:</b> '+(s.currentLocation||"—")+'</p>'+
      '<h3>Tracking History</h3><div class="timeline">'+
      s.trackingEvents.map(e=>'<div class="event"><b>'+e.status.replaceAll("_"," ")+'</b><br>'+e.location+'<br>'+(e.description||"")+'<br><small>'+new Date(e.eventTimestamp).toLocaleString()+'</small></div>').join("")+
      '</div><h3>Add Tracking Event</h3>'+
      '<div class="row"><select id="eventStatus">'+
      ["SHIPMENT_RECEIVED","PICKED_UP","IN_TRANSIT","AT_SORTING_FACILITY","AT_DESTINATION_HUB","CUSTOMS_CLEARANCE","OUT_FOR_DELIVERY","DELIVERED","DELAYED","EXCEPTION"].map(x=>'<option>'+x+'</option>').join("")+
      '</select><input id="eventLocation" placeholder="Location"><input id="eventDescription" placeholder="Description"><button onclick="addEvent(\''+id+'\')">Add Event</button></div>';
  }catch(e){alert(e.message)}
}

async function addEvent(id){
  try{
    await request("/api/admin/shipments/"+id+"/events",{method:"POST",body:JSON.stringify({
      status:$("eventStatus").value,
      location:$("eventLocation").value,
      description:$("eventDescription").value
    })});
    viewShipment(id);loadStats();loadShipments();
  }catch(e){alert(e.message)}
}

(async function(){
  if(!token)return;
  try{
    await request("/api/admin/stats");
    openDashboard();
  }catch{
    localStorage.removeItem("royale_admin_token");
    token="";
  }
})();
</script>
</body>
</html>
